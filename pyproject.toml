[project]
name = "gittoolbox"
version = "1.0.0"
description = "Keep a folder full of git repositories tidy: refresh them, count and clean branches, audit READMEs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Olivier Leteneur" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
git-toolbox = "gittoolbox.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
